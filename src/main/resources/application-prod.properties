# PRODUCTION
spring.thymeleaf.cache=true
logging.level.root=INFO
logging.level.com.civictrack=INFO

# Cookies only over HTTPS; trust the proxy's X-Forwarded-* headers (Render, Oracle + nginx, ...)
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

civictrack.seed-demo-data=false
