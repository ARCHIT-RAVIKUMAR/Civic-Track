spring.application.name=civictrack
spring.profiles.default=dev

# Optional local .env file (KEY=value lines). It is git-ignored. Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Database (values come from environment variables, never from source code) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema. Hibernate only CHECKS that entities match the tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# ---- File upload ----
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
civictrack.upload-dir=${UPLOAD_DIR:uploads}

# ---- Notifications: log (default) or email ----
civictrack.notification.mode=${NOTIFICATION_MODE:log}
civictrack.notification.from=${MAIL_FROM:no-reply@civictrack.local}

# ---- Initial admin (optional; set both env vars to create the first admin) ----
civictrack.admin.email=${ADMIN_EMAIL:}
civictrack.admin.password=${ADMIN_PASSWORD:}
civictrack.seed-demo-data=false

# ---- Login protection: lock an account for N minutes after M wrong passwords ----
civictrack.security.max-login-attempts=5
civictrack.security.lock-minutes=10

# ---- Photo storage: "local" (disk, default) or "supabase" (permanent, needs a private bucket) ----
civictrack.storage.mode=${STORAGE_MODE:local}
civictrack.storage.supabase-url=${SUPABASE_URL:}
civictrack.storage.supabase-key=${SUPABASE_KEY:}
civictrack.storage.bucket=${SUPABASE_BUCKET:complaint-images}
