<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | CivicTrack</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #212529;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
        .box { max-width: 420px; padding: 2rem; }
        h1 { margin: 0 0 .5rem; }
        button { background: #0d6efd; color: #fff; border: 0; border-radius: .5rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
        @media (prefers-color-scheme: dark) { body { background: #212529; color: #f8f9fa; } }
    </style>
</head>
<body>
<div class="box">
    <h1>You are offline</h1>
    <p>CivicTrack needs an internet connection. Please check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
