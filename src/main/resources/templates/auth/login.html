<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5" style="max-width: 460px;">
    <h1 class="h3 mb-4">Log in</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="alert alert-danger" role="alert" th:if="${param.error}">Invalid email or password. After several wrong attempts an account is locked for a few minutes.</div>
    <div class="alert alert-success" role="alert" th:if="${param.logout}">You have been logged out.</div>

    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="email" class="form-control" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 text-center">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
