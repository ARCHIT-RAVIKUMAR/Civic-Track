<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4 auth-wrap">
    <div class="card shadow-sm auth-card"><div class="card-body p-4">
        <div class="text-center mb-4">
            <div class="auth-logo mb-2"><i class="bi bi-buildings"></i></div>
            <h1 class="h4 mb-1">Welcome back</h1>
            <p class="text-muted small mb-0">Log in to report issues and follow their progress.</p>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="alert alert-danger" role="alert" th:if="${param.error}">
            Invalid email or password. After several wrong attempts an account is locked for a few minutes.</div>
        <div class="alert alert-success" role="alert" th:if="${param.logout}">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" autocapitalize="none" spellcheck="false" class="form-control" id="username" name="username" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password"
                            aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">Log in</button>
        </form>
        <p class="mt-3 mb-1 text-center small text-muted">Forgot your password? Ask an administrator to reset it.</p>
        <p class="mb-0 text-center small">New here? <a th:href="@{/register}">Create an account</a></p>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
