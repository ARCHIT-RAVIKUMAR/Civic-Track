<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Authority dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Complaints</h1>
        <div class="d-flex gap-2"><button type="button" class="btn btn-outline-secondary btn-sm" data-refresh><i class="bi bi-arrow-clockwise"></i> Refresh</button><a class="btn btn-outline-primary btn-sm" th:href="@{/authority/map}"><i class="bi bi-map"></i> Map view</a></div>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap gap-2 mb-4" aria-label="Filter by status">
        <a class="stat-chip" th:classappend="${filter.status == null and !filter.overdue} ? 'active'" th:href="@{/authority/dashboard}">All</a>
        <a class="stat-chip" th:classappend="${filter.overdue} ? 'active'" th:href="@{/authority/dashboard(overdue=true)}">
            <i class="bi bi-alarm"></i> Overdue <strong th:text="${overdueCount}">0</strong>
        </a>
        <a class="stat-chip" th:each="s : ${statuses}" th:if="${counts.get(s) > 0 or filter.status == s}"
           th:classappend="${filter.status == s} ? 'active'"
           th:href="@{/authority/dashboard(status=${s.name()})}">
            <span th:text="${s.label}">Status</span> <strong th:text="${counts.get(s)}">0</strong>
        </a>
    </div>


    <button class="btn btn-outline-secondary d-md-none mb-2 w-100" type="button" data-bs-toggle="collapse"
            data-bs-target="#filterPanel" aria-expanded="false" aria-controls="filterPanel">
        <i class="bi bi-funnel"></i> Search &amp; filters
    </button>
    <form id="filterPanel" th:action="@{/authority/dashboard}" method="get" class="collapse d-md-block card card-body shadow-sm mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-12">
                <label for="q" class="form-label">Search</label>
                <input type="search" class="form-control" id="q" name="q" th:value="${filter.q}"
                       placeholder="Search title, description or location" maxlength="100">
            </div>
            <div class="col-md-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                            th:selected="${filter.status == s}">Status</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="categoryId" class="form-label">Category</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">All</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${filter.categoryId != null and filter.categoryId == c.id}">Category</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="from" class="form-label">From</label>
                <input type="date" class="form-control" id="from" name="from" th:value="${filter.from}">
            </div>
            <div class="col-md-2">
                <label for="to" class="form-label">To</label>
                <input type="date" class="form-control" id="to" name="to" th:value="${filter.to}">
            </div>
            <div class="col-md-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="overdue" name="overdue" value="true" th:checked="${filter.overdue}">
                    <label class="form-check-label" for="overdue">Overdue only (open longer than the target for its priority)</label>
                </div>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Filter</button>
                <a class="btn btn-outline-secondary" th:href="@{/authority/dashboard}">Reset</a>
            </div>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted" th:text="${page.totalElements} + ' complaint(s) found'">0 found</span>
        <a class="btn btn-sm btn-outline-primary"
           th:href="@{/authority/export(q=${filter.q},overdue=${filter.overdue},status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">
            Export CSV</a>
    </div>

    <div class="card card-body text-center py-5" th:if="${page.empty}">
        <p class="mb-0 fs-5">No complaints match these filters.</p>
    </div>

    <div class="table-responsive card shadow-sm" th:unless="${page.empty}">
        <table class="table table-stack table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>Reference</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Submitted</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${page.content}">
                <td data-label="Reference" class="text-nowrap" th:text="${c.referenceNumber}">CT-0000-0000</td>
                <td data-label="Title" th:text="${c.title}">Title</td>
                <td data-label="Category" th:text="${c.category.name}">Category</td>
                <td data-label="Priority"><span class="badge" th:classappend="'text-bg-' + ${c.priority.badgeClass}" th:text="${c.priority.label}">Priority</span></td>
                <td data-label="Status"><span class="badge" th:classappend="'text-bg-' + ${c.status.badgeClass}" th:text="${c.status.label}">Status</span> <span class="badge text-bg-danger" th:if="${c.overdue}">Overdue</span></td>
                <td data-label="Submitted" th:text="${c.createdAtDisplay}">Date</td>
                <td data-label=""><a class="btn btn-sm btn-outline-primary" th:href="@{/complaints/{id}(id=${c.id})}">Open</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}" aria-label="Pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/authority/dashboard(page=${page.number - 1},q=${filter.q},overdue=${filter.overdue},status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/authority/dashboard(page=${page.number + 1},q=${filter.q},overdue=${filter.overdue},status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">Next</a>
            </li>
        </ul>
    </nav>

    <h2 class="h5 mt-5 mb-3">Statistics</h2>
    <div th:replace="~{fragments/charts :: charts}"></div>
    <div th:replace="~{fragments/satisfaction :: satisfaction}"></div>
</main>
<div th:replace="~{fragments/welcome :: welcome}"></div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
