<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Authority dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Complaints</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3 col-lg" th:each="s : ${statuses}">
            <div class="card stat-card shadow-sm text-center"><div class="card-body py-3">
                <div class="display-6" th:text="${counts.get(s)}">0</div>
                <span class="badge" th:classappend="'text-bg-' + ${s.badgeClass}" th:text="${s.label}">Status</span>
            </div></div>
        </div>
    </div>

    <form th:action="@{/authority/dashboard}" method="get" class="card card-body shadow-sm mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                            th:selected="${filter.status == s}">Status</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="categoryId" class="form-label">Category</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">All</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${filter.categoryId != null and filter.categoryId == c.id}">Category</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="from" class="form-label">From</label>
                <input type="date" class="form-control" id="from" name="from" th:value="${filter.from}">
            </div>
            <div class="col-md-2">
                <label for="to" class="form-label">To</label>
                <input type="date" class="form-control" id="to" name="to" th:value="${filter.to}">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Filter</button>
                <a class="btn btn-outline-secondary" th:href="@{/authority/dashboard}">Reset</a>
            </div>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted" th:text="${page.totalElements} + ' complaint(s) found'">0 found</span>
        <a class="btn btn-sm btn-outline-primary"
           th:href="@{/authority/export(status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">
            Export CSV</a>
    </div>

    <div class="card card-body text-center py-5" th:if="${page.empty}">
        <p class="mb-0 fs-5">No complaints match these filters.</p>
    </div>

    <div class="table-responsive card shadow-sm" th:unless="${page.empty}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Submitted</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${page.content}">
                <td th:text="${c.title}">Title</td>
                <td th:text="${c.category.name}">Category</td>
                <td><span class="badge" th:classappend="'text-bg-' + ${c.priority.badgeClass}" th:text="${c.priority.label}">Priority</span></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${c.status.badgeClass}" th:text="${c.status.label}">Status</span></td>
                <td th:text="${c.createdAtDisplay}">Date</td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/complaints/{id}(id=${c.id})}">Open</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}" aria-label="Pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/authority/dashboard(page=${page.number - 1},status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/authority/dashboard(page=${page.number + 1},status=${filter.status},categoryId=${filter.categoryId},from=${filter.from},to=${filter.to})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
