<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My assignments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">My assignments</h1>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/worker/map}"><i class="bi bi-map"></i> Map view</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card card-body text-center py-5" th:if="${#lists.isEmpty(complaints)}">
        <p class="mb-1 fs-5">Nothing assigned to you right now.</p>
        <p class="text-muted mb-0">New work will appear here when an authority assigns it.</p>
    </div>

    <div class="table-responsive card shadow-sm" th:unless="${#lists.isEmpty(complaints)}">
        <table class="table table-stack table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>Reference</th><th>Title</th><th>Location</th><th>Priority</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${complaints}">
                <td data-label="Reference" class="text-nowrap" th:text="${c.referenceNumber}">CT-0000-0000</td>
                <td data-label="Title" th:text="${c.title}">Title</td>
                <td data-label="Location" th:text="${c.location}">Location</td>
                <td data-label="Priority"><span class="badge" th:classappend="'text-bg-' + ${c.priority.badgeClass}" th:text="${c.priority.label}">Priority</span></td>
                <td data-label="Status"><span class="badge" th:classappend="'text-bg-' + ${c.status.badgeClass}" th:text="${c.status.label}">Status</span> <span class="badge text-bg-danger" th:if="${c.overdue}">Overdue</span></td>
                <td data-label=""><a class="btn btn-sm btn-outline-primary" th:href="@{/complaints/{id}(id=${c.id})}">Open</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
