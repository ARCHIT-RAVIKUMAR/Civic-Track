<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Notifications</h1>
        <form th:action="@{/notifications/read-all}" method="post" th:unless="${page.empty}">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Mark all as read</button>
        </form>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card card-body text-center py-5" th:if="${page.empty}">
        <p class="mb-1 fs-5">No notifications yet.</p>
        <p class="text-muted mb-0">You will be notified here when something needs your attention.</p>
    </div>

    <div class="list-group shadow-sm" th:unless="${page.empty}">
        <div class="list-group-item d-flex justify-content-between align-items-start gap-3"
             th:each="n : ${page.content}" th:classappend="${!n.read} ? 'list-group-item-primary'">
            <div>
                <div th:classappend="${!n.read} ? 'fw-bold'" th:text="${n.title}">Title</div>
                <div class="small" th:text="${n.message}">Message</div>
                <div class="small text-muted" th:text="${n.createdAtDisplay}">Date</div>
            </div>
            <form th:action="@{/notifications/{id}/open(id=${n.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-primary"
                        th:text="${n.complaint != null} ? 'Open' : 'Mark read'">Open</button>
            </form>
        </div>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}" aria-label="Pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/notifications(page=${page.number - 1})}">Previous</a></li>
            <li class="page-item disabled"><span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/notifications(page=${page.number + 1})}">Next</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
