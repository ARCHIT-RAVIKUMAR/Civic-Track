<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Admin overview')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">System overview</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h2 class="h6 text-muted">Users</h2>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3" th:each="entry : ${usersByRole}">
            <div class="card stat-card shadow-sm text-center"><div class="card-body py-3">
                <div class="display-6" th:text="${entry.value}">0</div>
                <div class="small text-muted" th:text="${entry.key}">Role</div>
            </div></div>
        </div>
    </div>

    <h2 class="h6 text-muted">Complaints by status</h2>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3 col-lg" th:each="entry : ${counts}">
            <div class="card stat-card shadow-sm text-center"><div class="card-body py-3">
                <div class="display-6" th:text="${entry.value}">0</div>
                <span class="badge" th:classappend="'text-bg-' + ${entry.key.badgeClass}" th:text="${entry.key.label}">Status</span>
            </div></div>
        </div>
    </div>

    <h2 class="h6 text-muted">Recent complaints</h2>
    <div class="card card-body text-center" th:if="${#lists.isEmpty(recent)}">No complaints yet.</div>
    <div class="table-responsive card shadow-sm" th:unless="${#lists.isEmpty(recent)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Title</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${recent}">
                <td th:text="${c.title}">Title</td>
                <td><span class="badge" th:classappend="'text-bg-' + ${c.status.badgeClass}" th:text="${c.status.label}">Status</span></td>
                <td th:text="${c.createdAtDisplay}">Date</td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/complaints/{id}(id=${c.id})}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
