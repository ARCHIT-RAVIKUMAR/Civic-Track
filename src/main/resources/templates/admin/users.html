<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Manage users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Manage users</h1>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/users/export}"><i class="bi bi-download"></i> Export CSV</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <form th:action="@{/admin/users}" th:object="${userForm}" method="post" class="card card-body shadow-sm" novalidate>
                <h2 class="h6">Create a staff account</h2>
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" autocapitalize="none" spellcheck="false" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Temporary password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" data-password-rules th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password"
                                aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                        <option value="">-- choose --</option>
                        <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}">Role</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Create user</button>
            </form>
        </div>

        <div class="col-lg-8">
            <!-- no .table-responsive here: it would clip the actions menu -->
            <div class="card shadow-sm">
                <table class="table table-stack align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td data-label="Name" class="fw-semibold" th:text="${u.fullName}">Name</td>
                        <td data-label="Email" class="text-break" th:text="${u.email}">email</td>
                        <td data-label="Role"><span class="badge text-bg-primary" th:text="${u.role.label}">Role</span></td>
                        <td data-label="Status"><span class="badge" th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span></td>
                        <td data-label="" class="text-end">
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="dropdown"
                                        aria-expanded="false" th:attr="aria-label=${'Actions for ' + u.fullName}">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" th:href="@{/admin/users/{id}/edit(id=${u.id})}">
                                        <i class="bi bi-pencil me-2"></i>Edit user</a></li>
                                    <li><a class="dropdown-item" th:href="@{/admin/users/{id}/activity(id=${u.id})}">
                                        <i class="bi bi-clock-history me-2"></i>View activity</a></li>
                                    <li><a class="dropdown-item" th:href="@{/admin/users/{id}/reset-password(id=${u.id})}">
                                        <i class="bi bi-key me-2"></i>Reset password</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" class="m-0"
                                              onsubmit="return confirm('Change the status of this account?');">
                                            <button type="submit" class="dropdown-item">
                                                <i class="bi bi-person-slash me-2"></i>
                                                <span th:text="${u.enabled} ? 'Disable account' : 'Enable account'">Disable account</span>
                                            </button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="m-0"
                                              onsubmit="return confirm('Delete this user permanently? This cannot be undone.');">
                                            <button type="submit" class="dropdown-item text-danger">
                                                <i class="bi bi-trash me-2"></i>Delete</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
