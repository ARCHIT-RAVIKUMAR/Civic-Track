<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-1">Audit log</h1>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/audit/export}"><i class="bi bi-download"></i> Export CSV</a>
    </div>
    <p class="text-muted">Every status change, assignment, priority change and worker note on every complaint, newest first.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card card-body text-center py-5" th:if="${page.empty}">
        <p class="mb-0 fs-5">Nothing has been recorded yet.</p>
    </div>

    <div class="table-responsive card shadow-sm" th:unless="${page.empty}">
        <table class="table table-stack table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>When</th><th>Who</th><th>Complaint</th><th>Change</th><th>Notes</th></tr>
            </thead>
            <tbody>
            <tr th:each="h : ${page.content}">
                <td data-label="When" class="text-nowrap" th:text="${h.createdAtDisplay}">Date</td>
                <td data-label="Who">
                    <span th:text="${h.changedBy.fullName}">User</span><br>
                    <span class="badge text-bg-light" th:text="${h.changedBy.role.label}">Role</span>
                </td>
                <td data-label="Complaint"><a th:href="@{/complaints/{id}(id=${h.complaint.id})}" th:text="${h.complaint.title}">Title</a></td>
                <td data-label="Change" class="text-nowrap">
                    <span class="text-muted" th:if="${h.oldStatus != null and h.oldStatus != h.newStatus}"
                          th:text="${h.oldStatus.label} + ' → '">old</span>
                    <span class="badge" th:classappend="'text-bg-' + ${h.newStatus.badgeClass}" th:text="${h.newStatus.label}">Status</span>
                </td>
                <td data-label="Notes" th:text="${h.notes}">Notes</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${page.totalPages > 1}" aria-label="Pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/audit(page=${page.number - 1})}">Previous</a></li>
            <li class="page-item disabled"><span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/audit(page=${page.number + 1})}">Next</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
