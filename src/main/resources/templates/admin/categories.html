<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Manage categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Complaint categories</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post" class="card card-body shadow-sm" novalidate>
                <h2 class="h6">Add a category</h2>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description (optional)</label>
                    <input type="text" class="form-control" id="description" th:field="*{description}"
                           th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Add category</button>
            </form>
        </div>
        <div class="col-lg-8">
            <div class="table-responsive card shadow-sm">
                <table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Name</th><th>Description</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.name}">Name</td>
                        <td th:text="${c.description}">Description</td>
                        <td><span class="badge" th:classappend="${c.active} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${c.active} ? 'Active' : 'Hidden'">Active</span></td>
                        <td>
                            <form th:action="@{/admin/categories/{id}/toggle(id=${c.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-secondary"
                                        th:text="${c.active} ? 'Hide' : 'Show'">Hide</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
