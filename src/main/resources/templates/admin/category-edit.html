<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit category')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4" style="max-width: 520px;">
    <a class="btn btn-outline-secondary btn-sm" data-back th:href="@{/admin/categories}"><i class="bi bi-arrow-left"></i> Back</a>
    <h1 class="h3 mt-3 mb-3">Edit category</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/admin/categories/{id}/edit(id=${category.id})}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${category.name}" maxlength="80" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description (optional)</label>
            <input type="text" class="form-control" id="description" name="description"
                   th:value="${category.description}" maxlength="255">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
