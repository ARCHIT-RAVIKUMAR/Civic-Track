<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4" style="max-width: 520px;">
    <a class="btn btn-outline-secondary btn-sm" data-back th:href="@{/admin/users}"><i class="bi bi-arrow-left"></i> Back</a>
    <h1 class="h3 mt-2 mb-1">Reset password</h1>
    <p class="text-muted">
        Set a new password for <strong th:text="${subject.fullName}">Name</strong>
        (<span th:text="${subject.email}">email</span>). Share it with them privately and ask them to change it
        from <em>My profile</em> after logging in.
    </p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/admin/users/{id}/reset-password(id=${subject.id})}" th:object="${resetForm}" method="post"
          class="card card-body shadow-sm" novalidate>
        <div class="mb-3">
            <label for="newPassword" class="form-label">New password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="newPassword" data-password-rules th:field="*{newPassword}"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" autocomplete="new-password">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword"
                        aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm new password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'" autocomplete="new-password">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword"
                        aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback" th:errors="*{passwordConfirmed}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">Reset password</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
