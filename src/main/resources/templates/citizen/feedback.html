<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Feedback')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="main-content" class="container py-4" style="max-width: 560px;">
    <h1 class="h3 mb-1">How did we do?</h1>
    <p class="text-muted" th:text="${complaint.title}">Complaint title</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/citizen/complaints/{id}/feedback(id=${complaint.id})}" th:object="${feedbackForm}"
          method="post" class="card card-body shadow-sm" novalidate>
        <div class="mb-3">
            <label for="rating" class="form-label">Rating</label>
            <select class="form-select" id="rating" th:field="*{rating}"
                    th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'">
                <option value="">-- choose --</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Very poor</option>
            </select>
            <div class="invalid-feedback" th:errors="*{rating}"></div>
        </div>
        <div class="mb-3">
            <label for="comments" class="form-label">Comments (optional)</label>
            <textarea class="form-control" id="comments" rows="3" th:field="*{comments}"
                      th:classappend="${#fields.hasErrors('comments')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{comments}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Send feedback</button>
            <a class="btn btn-outline-secondary" th:href="@{/complaints/{id}(id=${complaint.id})}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
